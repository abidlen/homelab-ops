services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: start
    ports:
      - "8082:8080"  # Exposed locally so NPM can route to it
    restart: unless-stopped
    environment:
      # Administrative Bootstrapping (Uncomment on first boot, then re-comment)
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=VMware1!Admin
      
      # Proxy & Hostname Configuration (Keycloak 26+ Standard)
      - KC_HOSTNAME=keycloak.example.net
      - KC_PROXY_HEADERS=x-forwarded
      - KC_HTTP_ENABLED=true
      - KC_STRICT_HTTPS=true
      
      # Database Backend
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=VMware123!VMware123!
    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak-db:
    image: postgres:16.2
    container_name: keycloak-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=VMware123!VMware123!
    volumes:
      # Persistent runtime data stored outside the git directory
      - /data/keycloak/postgresql-data:/var/lib/postgresql/data
      - /mnt/storage/backups/keycloak:/data/postgresql/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5
