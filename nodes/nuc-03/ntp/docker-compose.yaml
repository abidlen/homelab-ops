services:
  ntp:
    image: cturra/ntp:latest
    container_name: ntp
    restart: unless-stopped
    ports:
      - "123:123/udp"
    environment:
      # Use fast, reliable upstreams (Cloudflare & Google)
      - NTP_SERVERS=time.cloudflare.com,time.google.com
      - LOG_LEVEL=0
    # Optional: set your timezone (affects log timestamps)
      - TZ=America/New_York
      # Optional: enable@ Network Time Security (NTS)
      # - ENABLE_NTS=trueap_add:
    # Critical: Allows the container to manipulate the clock if needed
    # and handle high-precision timing.
    cap_add:
      - SYS_TIME
    read_only: true
    tmpfs:
      - /etc/chrony:rw,mode=1750
      - /run/chrony:rw,mode=1750
      - /var/lib/chrony:rw,mode=1750
