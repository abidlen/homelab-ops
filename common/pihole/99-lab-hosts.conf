# === Allow DNS queries from all homelab networks ===
# Required because clients are on 192.168.6.x (wireless) and servers on 192.168.55.x
# "Permit all origins" equivalent for dnsmasq
except-interface=nonexisting
localise-queries

# Wildcard catch-all for *.example.net → NPM on nuc-04
address=/.example.net/192.168.55.4

# NPM Managed names (for proxy/easy access)
#host-record=pihole-03.example.net,192.168.55.4
#host-record=pihole-04.example.net,192.168.55.4
#host-record=npm.example.net,192.168.55.4/
cname=pihole-03.example.net,nuc-04.example.net
cname=pihole-04.example.net,nuc-04.example.net
cname=npm.example.net,nuc-04.example.net

# --- 192.168.55.x Network (Infrastructure & Management) ---
host-record=nuc-03.example.net,192.168.55.3
host-record=nuc-04.example.net,192.168.55.4
host-record=vcf-installer-01.example.net,192.168.55.99
host-record=p-control-01.ad.example.net,192.168.55.15
host-record=p-esx-21.example.net,192.168.55.21
host-record=p-esx-22.example.net,192.168.55.22
host-record=p-vcsa-01.ad.example.net,192.168.55.25
host-record=vvf-vcsa-01.example.net,192.168.55.26
host-record=vvf-ops-01.example.net,192.168.55.30
host-record=cm-ops-01.ad.example.net,192.168.55.31
