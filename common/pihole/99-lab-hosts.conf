# --- Moving away from .ad fqdn ---
cname=p-storage-01.ad.example.net,p-storage-01.example.net

# --- BW's Domains - example.com and enterpriseadmins.org ---
host-record=rootca.example.com,192.168.127.30
# Forward all queries the following domains and its subdomains to the designated DNS server
address=/.example.com/192.168.127.30
address=/.lab.enterpriseadmins.org/192.168.127.30


